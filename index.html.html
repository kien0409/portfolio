<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cổng chào mừng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --c1: #ff2e93;
    --c2: #ff9f1c;
    --c3: #ffe14d;
    --c4: #2ee6a6;
    --c5: #2f9bff;
    --c6: #8a4dff;
    --card: rgba(255, 255, 255, 0.9);
    --ink: #2b0a4d;
    --ink-soft: #62408f;
    --field: #ffffff;
    --field-border: #d9c4ff;
    --error: #d1004f;
    --page-bg: #6a2fd0;
    --font: "Baloo 2", "Nunito", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --card: rgba(26, 10, 52, 0.86);
      --ink: #fff3fb;
      --ink-soft: #dcc8ff;
      --field: #2c1358;
      --field-border: #6b45b8;
      --error: #ff7aa8;
      --page-bg: #2a0d5c;
    }
  }
  :root[data-theme="dark"] {
    --card: rgba(26, 10, 52, 0.86);
    --ink: #fff3fb;
    --ink-soft: #dcc8ff;
    --field: #2c1358;
    --field-border: #6b45b8;
    --error: #ff7aa8;
    --page-bg: #2a0d5c;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    min-height: 100%;
    font-family: var(--font);
    color: var(--ink);
    background: var(--page-bg);
    overflow-x: hidden;
  }

  /* Animated rainbow backdrop */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(120deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c1));
    background-size: 400% 400%;
    animation: flow 18s linear infinite;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .backdrop { filter: saturate(1.05) brightness(0.62); }
  }
  :root[data-theme="dark"] .backdrop { filter: saturate(1.05) brightness(0.62); }
  @keyframes flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }

  .orb {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.7;
    pointer-events: none;
  }
  .orb.a { width: 46vmax; height: 46vmax; left: -14vmax; top: -12vmax; background: var(--c3); animation: drift 14s ease-in-out infinite alternate; }
  .orb.b { width: 40vmax; height: 40vmax; right: -12vmax; bottom: -10vmax; background: var(--c1); animation: drift 17s ease-in-out infinite alternate-reverse; }
  .orb.c { width: 30vmax; height: 30vmax; right: 10vmax; top: -8vmax; background: var(--c5); animation: drift 21s ease-in-out infinite alternate; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(6vmax, 5vmax) scale(1.18); }
  }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: 32px;
    padding: 36px 28px 32px;
    text-align: center;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow:
      0 0 0 4px rgba(255, 255, 255, 0.55),
      0 24px 60px rgba(60, 0, 120, 0.4);
  }
  .card[hidden] { display: none; }

  .badge {
    font-size: 64px;
    line-height: 1;
    margin-bottom: 8px;
    display: inline-block;
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-8px) rotate(6deg); }
  }

  h1 {
    margin: 0 0 8px;
    font-weight: 800;
    font-size: clamp(2rem, 8vw, 2.9rem);
    line-height: 1.1;
    background: linear-gradient(90deg, var(--c1), var(--c2), #f2b800, var(--c4), var(--c5), var(--c6), var(--c1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: 300% 0; }
  }

  .lead {
    margin: 0 0 24px;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  form { display: grid; gap: 14px; }
  label {
    display: block;
    text-align: left;
    font-weight: 700;
    font-size: 1rem;
    margin: 0 0 6px 6px;
    color: var(--ink);
  }
  input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--field);
    border: 3px solid var(--field-border);
    border-radius: 20px;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]::placeholder { color: var(--ink-soft); opacity: 0.7; }
  input[type="text"]:focus {
    border-color: var(--c1);
    box-shadow: 0 0 0 5px rgba(255, 46, 147, 0.28);
  }

  .btn {
    font: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 14px 28px;
    cursor: pointer;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c6));
    background-size: 200% 100%;
    box-shadow: 0 8px 0 rgba(90, 0, 110, 0.35), 0 14px 26px rgba(255, 46, 147, 0.35);
    text-shadow: 0 2px 0 rgba(90, 0, 110, 0.35);
    transition: transform 0.12s, box-shadow 0.12s, background-position 0.4s;
  }
  .btn:hover { background-position: 100% 0; }
  .btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 rgba(90, 0, 110, 0.35), 0 6px 14px rgba(255, 46, 147, 0.3);
  }
  .btn:focus-visible { outline: 4px solid var(--c3); outline-offset: 3px; }

  .btn.ghost {
    margin-top: 22px;
    background: var(--field);
    color: var(--ink);
    text-shadow: none;
    border: 3px solid var(--field-border);
    box-shadow: none;
    font-size: 1.05rem;
    padding: 10px 24px;
  }
  .btn.ghost:hover { border-color: var(--c1); }

  .error {
    min-height: 1.5em;
    margin: 0;
    font-weight: 700;
    color: var(--error);
  }
  .shake { animation: shake 0.45s; }
  @keyframes shake {
    20% { transform: translateX(-9px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(4px); }
  }

  .win-msg {
    margin: 0;
    font-weight: 800;
    font-size: clamp(1.9rem, 7.5vw, 2.7rem);
    line-height: 1.2;
    background: linear-gradient(90deg, var(--c1), var(--c2), #f2b800, var(--c4), var(--c5), var(--c6), var(--c1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
    overflow-wrap: anywhere;
  }
  .who {
    margin: 16px 0 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  #winCard { animation: pop 0.6s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop {
    from { transform: scale(0.6) rotate(-4deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .backdrop, .orb, .badge, h1, .win-msg, #winCard { animation: none; }
    .shake { animation: none; }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="orb a" aria-hidden="true"></div>
  <div class="orb b" aria-hidden="true"></div>
  <div class="orb c" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main>
    <!-- Trang 1: nhập họ tên -->
    <section class="card" id="homeCard" aria-labelledby="homeTitle">
      <div class="badge" aria-hidden="true">🌈</div>
      <h1 id="homeTitle">Cho mình biết tên bạn nhé!</h1>
      <p class="lead">Nhập họ và tên rồi bấm xác nhận.</p>
      <form id="nameForm" novalidate>
        <div>
          <label for="nameInput">Họ và tên</label>
          <input id="nameInput" type="text" name="name" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="name" autocapitalize="words" maxlength="80">
        </div>
        <p class="error" id="error" role="alert"></p>
        <button class="btn" type="submit">Xác nhận</button>
      </form>
    </section>

    <!-- Trang 2: chúc mừng -->
    <section class="card" id="winCard" aria-labelledby="winTitle" hidden>
      <div class="badge" aria-hidden="true">🎉</div>
      <p class="win-msg" id="winTitle">chuc mung vi da duoc kien cong nhan la ban</p>
      <p class="who" id="who"></p>
      <button class="btn ghost" type="button" id="backBtn">Nhập tên khác</button>
    </section>
  </main>

<script>
(function () {
  var KEYS = ["su", "bao", "ton"];
  var WIN_HASH = "#/chuc-mung";
  var verifiedName = null;

  var homeCard = document.getElementById("homeCard");
  var winCard = document.getElementById("winCard");
  var form = document.getElementById("nameForm");
  var input = document.getElementById("nameInput");
  var errorEl = document.getElementById("error");
  var whoEl = document.getElementById("who");
  var backBtn = document.getElementById("backBtn");

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Bỏ dấu tiếng Việt, đưa về chữ thường để so khớp
  function normalize(s) {
    return s
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d")
      .replace(/Đ/g, "d")
      .toLowerCase();
  }

  function isMatch(name) {
    var n = normalize(name);
    for (var i = 0; i < KEYS.length; i++) {
      if (n.indexOf(KEYS[i]) !== -1) return true;
    }
    return false;
  }

  function showError(msg) {
    errorEl.textContent = msg;
    homeCard.classList.remove("shake");
    void homeCard.offsetWidth;
    homeCard.classList.add("shake");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = input.value.replace(/\s+/g, " ").trim();
    if (!name) {
      showError("Bạn chưa nhập tên. Hãy gõ họ và tên nhé!");
      input.focus();
      return;
    }
    if (isMatch(name)) {
      errorEl.textContent = "";
      verifiedName = name;
      if (location.hash === WIN_HASH) render();
      else location.hash = WIN_HASH;
    } else {
      showError("Chưa có lời chúc cho tên này. Thử một tên khác nhé!");
      input.select();
    }
  });

  backBtn.addEventListener("click", function () {
    verifiedName = null;
    input.value = "";
    errorEl.textContent = "";
    location.hash = "#/";
  });

  function render() {
    if (location.hash === WIN_HASH && !verifiedName) {
      history.replaceState(null, "", "#/");
    }
    var onWin = location.hash === WIN_HASH && !!verifiedName;
    homeCard.hidden = onWin;
    winCard.hidden = !onWin;
    if (onWin) {
      whoEl.textContent = "Xin chào, " + verifiedName + "!";
      startConfetti();
      window.scrollTo(0, 0);
    } else {
      stopConfetti();
      try { input.focus({ preventScroll: true }); } catch (err) {}
    }
  }
  window.addEventListener("hashchange", render);

  /* ---------- Pháo giấy ---------- */
  var cv = document.getElementById("confetti");
  var ctx = cv.getContext("2d");
  var COLORS = ["#ff2e93", "#ff9f1c", "#ffe14d", "#2ee6a6", "#2f9bff", "#8a4dff", "#ffffff"];
  var parts = [], raf = null, W = 0, H = 0;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", function () { if (raf) resize(); });

  function make(initial) {
    return {
      x: Math.random() * W,
      y: initial ? -Math.random() * H : -20,
      w: 7 + Math.random() * 8,
      h: 10 + Math.random() * 10,
      vy: 1.6 + Math.random() * 2.8,
      vx: -1 + Math.random() * 2,
      sway: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      vr: -0.12 + Math.random() * 0.24,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      round: Math.random() < 0.3
    };
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.sway += 0.05;
      p.x += p.vx + Math.sin(p.sway) * 0.8;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > H + 30) parts[i] = make(false);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.round) {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }
    raf = requestAnimationFrame(loop);
  }

  function startConfetti() {
    if (reduceMotion || raf) return;
    resize();
    var count = W < 600 ? 90 : 170;
    parts = [];
    for (var i = 0; i < count; i++) parts.push(make(true));
    raf = requestAnimationFrame(loop);
  }

  function stopConfetti() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    parts = [];
    ctx.clearRect(0, 0, W, H);
  }

  render();
})();
</script>
</body>
</html>
